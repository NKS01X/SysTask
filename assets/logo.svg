<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3445"/>
      <stop offset="1" stop-color="#11151d"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#18c37e"/>
      <stop offset="0.6" stop-color="#3ddc97"/>
      <stop offset="1" stop-color="#7cf0c4"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#ff6b4a"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="32" y="28" width="448" height="448" rx="104" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="32" y="28" width="448" height="448" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  <path d="M136 28h240a104 104 0 0 1 104 104v40H32v-40A104 104 0 0 1 136 28z" fill="url(#gloss)"/>

  <!-- grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.07" stroke-width="2">
    <line x1="96" y1="164" x2="416" y2="164"/>
    <line x1="96" y1="228" x2="416" y2="228"/>
    <line x1="96" y1="292" x2="416" y2="292"/>
    <line x1="96" y1="356" x2="416" y2="356"/>
  </g>

  <!-- bars -->
  <g>
    <rect x="100" y="260" width="48" height="96" rx="12" fill="url(#bar)"/>
    <rect x="168" y="200" width="48" height="156" rx="12" fill="url(#bar)"/>
    <rect x="236" y="236" width="48" height="120" rx="12" fill="url(#bar)"/>
    <rect x="304" y="140" width="48" height="216" rx="12" fill="url(#hot)"/>
    <rect x="372" y="212" width="48" height="144" rx="12" fill="url(#bar)"/>
  </g>

  <!-- baseline -->
  <rect x="92" y="372" width="336" height="10" rx="5" fill="#ffffff" fill-opacity="0.18"/>
