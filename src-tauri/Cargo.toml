[package]
name = "systask"
version = "0.1.0"
description = "htop-style process manager for Linux"
edition = "2021"

[lib]
name = "systask_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.40", default-features = false, features = ["system", "user"] }
libc = "0.2"
